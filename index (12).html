<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مطعم الصعيدي</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf5ea;--card:#fff;--tx:#2a1a14;--mut:#7a655b;--red:#9b1c1c;--bd:#ead9c6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17100d;--card:#251a15;--tx:#f5e9dc;--mut:#b9a193;--bd:#3d2c24}}
:root[data-theme=dark]{--bg:#17100d;--card:#251a15;--tx:#f5e9dc;--mut:#b9a193;--bd:#3d2c24}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif}
header{background:var(--red);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{width:46px;height:46px;border-radius:50%;border:2px solid #fff;object-fit:cover}
header h1{font-size:19px;margin:0;flex:1}header small{display:block;font-weight:400;font-size:12px;opacity:.9}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--red);color:#fff}
button.g{background:transparent;color:inherit;border:1px solid var(--bd)}button.w{background:#fff;color:var(--red)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;position:sticky;top:calc(66px + env(safe-area-inset-top,0px));background:var(--bg);z-index:4}
.chips button{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.chips button.on{background:var(--red);color:#fff}
main{padding:0 14px 90px;max-width:900px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer}
.ph{height:110px;background:linear-gradient(135deg,#f3dcc0,#e9b98a);display:flex;align-items:center;justify-content:center;font-size:48px}
.ph img{width:100%;height:100%;object-fit:cover}.card div.b{padding:10px}.card b{display:block;font-size:14px}.pr{color:var(--red);font-weight:700;margin-top:4px}
.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;max-width:500px;margin:auto;z-index:6;padding:14px;font-size:16px}
.ov{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.sh h2{margin:0 0 10px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);margin:4px 0}
label.o{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-bottom:12px}label.o input{width:auto;margin:0}
.pay{margin:10px 0}.mut{color:var(--mut);font-size:13px}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{white-space:nowrap}
.box{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;text-align:center;padding-bottom:10px}.tile .ph{height:120px;margin-bottom:8px}.tile b{display:block}
.ph{overflow:hidden}.ph img{transition:transform .4s}.card:hover .ph img,.tile:hover .ph img{transform:scale(1.1)}
.tile,.card{animation:up .45s both;transition:transform .2s,box-shadow .2s}.tile:hover,.card:hover{transform:translateY(-4px);box-shadow:0 8px 18px #0002}.tile:active,.card:active{transform:scale(.97)}
.ttl{margin:14px 0 10px}.back{margin-top:12px}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sl{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.pg{animation:fade .35s}.ov{animation:fade .2s}.sh{animation:sl .3s ease-out}.fab{animation:pop .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{background:var(--red);color:#fff;padding:18px 14px 100px;line-height:2}footer a{color:#fff}
</style></head><body>
